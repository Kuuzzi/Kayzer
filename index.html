<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="login-screen" class="overlay">
    <div class="login-box">
      <h2>Restricted Access</h2>
      <p style="color: var(--text-muted);">Enter password to continue</p>
      <input type="password" id="pass-input" placeholder="Password..." autocomplete="off">
      <button id="login-btn" type="button">Unlock</button>
      <p id="error-msg" style="color: var(--danger); margin-top: 10px; font-weight: bold;"></p>
    </div>
  </div>

  <div id="main-app" style="display: none;">
    <div class="sidebar">
      <div class="logo">STREAM<span>GEN</span></div>
      <div class="nav-item active" onclick="switchTab('dashboard', this)">📊 Dashboard</div>
      <div class="nav-item" onclick="switchTab('generate', this)">⚙️ Generate</div>
      <div class="nav-item" onclick="switchTab('admin', this)" id="admin-nav" style="display:none;">🔐 Admin Panel</div>
      <button class="btn-danger" onclick="lockSite()">Lock Site</button>
    </div>

    <div class="main">
      <div id="dashboard" class="tab active">
        <h2>Dashboard</h2>

        <div class="card" id="generated-content-card" style="display: none;">
          <h3>Your Generated Access</h3>
          <div id="dashboard-result" style="margin-top: 15px;"></div>
        </div>
      </div>

      <div id="generate" class="tab">
        <h2>Generate Accounts</h2>
        <div class="gen-grid">
          <div class="gen-card" style="grid-column: 1 / -1; border-color: var(--accent); background: linear-gradient(145deg, var(--panel), #161b24);">
            <h3>🎬 Netflix Cookie Checker</h3>
            <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 15px;">Paste your Netflix cookie to generate TV, Mobile, and PC links.</p>
            <input type="text" id="nf-cookie" placeholder="Paste Netflix cookie (NetflixId=...)" style="width:100%; padding:15px; margin-bottom:15px; background:#050505; border:1px solid var(--border); color:#fff; border-radius: 10px;">
            <button onclick="checkNetflixCookie()">Check Cookie</button>
          </div>
        </div>
      </div>

      <div id="admin" class="tab">
        <h2>Admin Panel</h2>
        <div class="card">
          <h3>Add Stock</h3>
          <select id="stock-service">
            <option value="netflix_cookie">Netflix Cookie</option>
          </select>
          <textarea id="stock-data" placeholder="Paste cookie/account here..." rows="3"></textarea>
          <button onclick="addStock()" style="margin-top: 5px;">Add to Stock</button>
        </div>

        <div class="card">
          <h3>Current Stock</h3>
          <pre id="stock-viewer" style="background:#050505; padding:20px; color:var(--accent); max-height: 300px; overflow-y: auto; white-space: pre-wrap; border-radius: 10px; border: 1px solid var(--border); font-family: monospace;"></pre>
          <button onclick="exportConfig()" style="margin-top: 20px; background:var(--gold); color:#000;">Export Config.js</button>
        </div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
