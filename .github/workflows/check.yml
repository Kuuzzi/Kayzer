name: check-cookie
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  run:
    if: startsWith(github.event.issue.title, 'check ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests

      - name: Extract payload from issue
        id: extract
        run: |
          python - <<'PY'
          import os, re
          body = os.environ["ISSUE_BODY"]
          m = re.search(r"job:\s*(\S+)", body)
          job = m.group(1) if m else ""
          m = re.search(r"```\n(.*?)\n```", body, re.S)
          cookie = m.group(1) if m else ""
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"job={job}\n")
          with open("cookie.txt", "w") as f:
              f.write(cookie)
          PY
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}

      - name: Run checker
        env:
          JOB_ID: ${{ steps.extract.outputs.job }}
        run: |
          COOKIE_RAW="$(cat cookie.txt)" python checker.py

      - name: Commit result
        run: |
          git config user.name  "checker-bot"
          git config user.email "checker-bot@users.noreply.github.com"
          git add results/
          git commit -m "result ${{ steps.extract.outputs.job }}" || echo "nothing to commit"
          git push

      - name: Close issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --comment "Done."
